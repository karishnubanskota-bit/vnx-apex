name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Diagnose
        run: |
          echo "java: $(java -version 2>&1 | head -1)"
          echo "gradle: $(gradle --version 2>/dev/null | grep Gradle | head -1)"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" 2>/dev/null || echo "!! no sdk dir"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "!! no ndk dir"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "!! no platforms"
          which gcc || echo "!! no gcc"

      - name: Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Scaffold
        run: |
          mkdir -p app/src/main/java/ai/venice/vnx app/src/main/cpp \
                   app/src/main/res/drawable app/src/main/assets
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "VNX"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.0" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > app/proguard-rules.pro <<'EOF'
          -keep class rikka.shizuku.** { *; }
          -keep class moe.shizuku.** { *; }
          -dontwarn rikka.shizuku.**
          -dontwarn moe.shizuku.**
          -dontwarn androidx.compose.**
          EOF

          cat > app/build.gradle.kts <<'EOF'
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget

          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "ai.venice.vnx"
              compileSdk = 35

              defaultConfig {
                  applicationId = "ai.venice.vnx"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 8
                  versionName = "1.7"
              }

              buildTypes {
                  getByName("debug") {
                      isMinifyEnabled = false
                  }
                  getByName("release") {
                      isMinifyEnabled = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              buildFeatures { compose = true }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_17)
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="moe.shizuku.manager.permission.API_V23"/>

              <queries>
                  <package android:name="moe.shizuku.privileged.api"/>
                  <package android:name="com.dts.freefireth"/>
                  <package android:name="com.dts.freefiremax"/>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="VNX Apex"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OverlaySvc"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="game memory overlay"/>
                  </service>

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0B0E13" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#39FF88" android:pathData="M54,22a32,32 0 1,0 0,64a32,32 0 1,0 0,-64z"/>
              <path android:fillColor="#0B0E13" android:pathData="M54,31a23,23 0 1,0 0,46a23,23 0 1,0 0,-46z"/>
              <path android:fillColor="#39FF88" android:pathData="M51,10h6v32h-6z M51,66h6v32h-6z M10,51h32v6h-32z M66,51h32v6h-32z"/>
              <path android:fillColor="#FF3D71" android:pathData="M51,51h6v6h-6z"/>
          </vector>
          EOF

          cat > app/src/main/cpp/vnxmem.c <<'EOF'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <ctype.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <errno.h>
          #include <math.h>
          #include <sys/types.h>
          #include <sys/wait.h>
          #include <sys/ptrace.h>

          #define CHUNK     (512u * 1024u)
          #define MAXHITS   20000
          #define FSET_CAP  150000
          #define DEG2RAD   0.017453292519943295f
          #define RAD2DEG   57.29577951308232f
          #define DIRP      "/data/local/tmp/vnx"
          #define FSET      DIRP "/fset.bin"
          #define FSNAP     DIRP "/fset.bak"

          static int   g_fd  = -1;
          static pid_t g_pid = 0;
          static int   g_ptrace_note = 0;

          struct reg { unsigned long lo, hi; char perm[8]; char path[256]; };

          static int rd(unsigned long a, void *b, size_t n) {
              if (g_fd < 0 || !n) return -1;
              return pread(g_fd, b, n, (off_t)a) == (ssize_t)n ? 0 : -1;
          }

          static int wr(unsigned long a, const void *b, size_t n) {
              if (g_fd < 0 || !n) return -1;
              return pwrite(g_fd, b, n, (off_t)a) == (ssize_t)n ? 0 : -1;
          }

          static int rd_stable(unsigned long a, void *b, size_t n) {
              unsigned char *t = malloc(n ? n : 1);
              if (!t) return -1;
              int r = (!rd(a, b, n) && !rd(a, t, n) && !memcmp(b, t, n)) ? 0 : -1;
              free(t);
              return r;
          }

          static int tracerpid(pid_t pid) {
              char p[64], buf[512];
              snprintf(p, sizeof p, "/proc/%d/status", pid);
              FILE *f = fopen(p, "r");
              if (!f) return -1;
              int t = -1;
              while (fgets(buf, sizeof buf, f))
                  if (!strncmp(buf, "TracerPid:", 10)) { t = atoi(buf + 10); break; }
              fclose(f);
              return t;
          }

          static int parse_maps(pid_t pid, struct reg **out) {
              char p[64];
              snprintf(p, sizeof p, "/proc/%d/maps", pid);
              FILE *f = fopen(p, "r");
              if (!f) { *out = NULL; return -1; }
              size_t cap = 256, n = 0;
              struct reg *v = malloc(cap * sizeof *v);
              if (!v) { fclose(f); *out = NULL; return -1; }
              char line[512];
              while (fgets(line, sizeof line, f)) {
                  if (n == cap) {
                      cap *= 2;
                      struct reg *nv = realloc(v, cap * sizeof *v);
                      if (!nv) break;
                      v = nv;
                  }
                  unsigned long lo = 0, hi = 0;
                  char perm[8] = {0}, path[256] = {0};
                  int k = sscanf(line, "%lx-%lx %7s %*s %*s %*s %255s", &lo, &hi, perm, path);
                  if (k < 3) continue;
                  v[n].lo = lo; v[n].hi = hi;
                  memcpy(v[n].perm, perm, sizeof v[n].perm);
                  memcpy(v[n].path, path, sizeof v[n].path);
                  n++;
              }
              fclose(f);
              *out = v;
              return (int)n;
          }

          static const char *base_name(const char *p) {
              const char *s = strrchr(p, '/');
              return s ? s + 1 : p;
          }

          static int mem_open(pid_t pid) {
              if (g_fd >= 0 && g_pid == pid) return 0;
              if (g_fd >= 0) { close(g_fd); g_fd = -1; }

              char path[64];
              snprintf(path, sizeof path, "/proc/%d/mem", pid);

              struct reg *v = NULL;
              int nr = parse_maps(pid, &v);
              unsigned long probe = 0;
              for (int i = 0; i < nr; i++) {
                  if (v[i].perm[0] == 'r' && (v[i].hi - v[i].lo) >= 64) { probe = v[i].lo; break; }
              }
              if (v) free(v);

              int fd = open(path, O_RDWR);
              if (fd >= 0) {
                  g_fd = fd; g_pid = pid;
                  if (!probe) return 0;
                  unsigned char t[16];
                  if (pread(fd, t, 16, (off_t)probe) == 16) return 0;
                  close(fd); g_fd = -1;
              }

              if (ptrace(PTRACE_ATTACH, pid, 0, 0) != 0) {
                  printf("! open %s failed and ptrace failed: %s\n", path, strerror(errno));
                  return -1;
              }
              int st = 0;
              waitpid(pid, &st, 0);
              usleep(25000);
              fd = open(path, O_RDWR);
              ptrace(PTRACE_DETACH, pid, 0, 0);
              if (fd < 0) { printf("! open %s after attach failed: %s\n", path, strerror(errno)); return -1; }
              g_fd = fd; g_pid = pid;
              if (probe) {
                  unsigned char t[16];
                  if (pread(fd, t, 16, (off_t)probe) != 16) { printf("! probe after attach failed\n"); return -1; }
              }
              g_ptrace_note = 1;
              return 0;
          }

          static int compile_pat(char type, const char *str,
                                 unsigned char *pat, unsigned char *msk, int *esz) {
              *esz = 0;
              switch (type) {
                  case 'b':
                      pat[0] = (unsigned char)strtol(str, NULL, 0);
                      msk[0] = 0xFF; *esz = 1; return 1;
                  case 'w': {
                      unsigned long x = strtoul(str, NULL, 0);
                      memcpy(pat, &x, 4); memset(msk, 0xFF, 4); *esz = 4; return 4;
                  }
                  case 'f': {
                      float x = strtof(str, NULL);
                      memcpy(pat, &x, 4); memset(msk, 0xFF, 4); *esz = 4; return 4;
                  }
                  case 'd': {
                      double x = strtod(str, NULL);
                      memcpy(pat, &x, 8); memset(msk, 0xFF, 8); *esz = 8; return 8;
                  }
                  case 'h': {
                      int n = 0;
                      const char *s = str;
                      while (*s) {
                          while (*s == ' ' || *s == ',') s++;
                          if (!*s) break;
                          if (s[0] == '?' && (s[1] == '?' || s[1] == 0)) {
                              pat[n] = 0; msk[n] = 0; n++; s += s[1] ? 2 : 1;
                              if (n >= 64) break;
                              continue;
                          }
                          if (!isxdigit((unsigned char)s[0]) ||
                              !isxdigit((unsigned char)s[1])) return -1;
                          char b[3] = { s[0], s[1], 0 };
                          pat[n] = (unsigned char)strtoul(b, NULL, 16);
                          msk[n] = 0xFF; n++; s += 2;
                          if (n >= 64) break;
                      }
                      return n;
                  }
                  default: return -1;
              }
          }

          static int pat_match(const unsigned char *m, const unsigned char *pat,
                               const unsigned char *msk, int n) {
              if (msk[0] == 0xFF && m[0] != pat[0]) return 0;
              for (int i = 1; i < n; i++)
                  if ((m[i] & msk[i]) != (pat[i] & msk[i])) return 0;
              return 1;
          }

          static int scan_region(unsigned long lo, unsigned long hi,
                                 const unsigned char *pat, const unsigned char *msk,
                                 int n, uint64_t *hits, int max) {
              if (n <= 0 || max <= 0 || lo >= hi) return 0;
              size_t bufsz = (size_t)CHUNK + (size_t)n;
              unsigned char *buf = malloc(bufsz);
              if (!buf) return 0;
              int cnt = 0;
              for (unsigned long a = lo; a < hi && cnt < max; a += CHUNK) {
                  size_t want = (size_t)(hi - a) < bufsz ? (size_t)(hi - a) : bufsz;
                  if (rd(a, buf, want)) continue;
                  size_t lim = want >= (size_t)n ? want - (size_t)n : 0;
                  for (size_t o = 0; o <= lim && cnt < max; o++)
                      if (pat_match(buf + o, pat, msk, n)) hits[cnt++] = (uint64_t)(a + o);
              }
              free(buf);
              return cnt;
          }

          static int hexb(const char *s, unsigned char *out, size_t cap) {
              size_t n = 0;
              while (*s && n < cap) {
                  while (*s == ' ' || *s == ',') s++;
                  if (!*s) break;
                  if (!isxdigit((unsigned char)s[0])) { s++; continue; }
                  int two = s[1] && isxdigit((unsigned char)s[1]);
                  char b[3] = { s[0], two ? s[1] : '0', 0 };
                  out[n++] = (unsigned char)strtoul(b, NULL, 16);
                  s += two ? 2 : 1;
              }
              return (int)n;
          }

          static int type_bytes(char type, double v, unsigned char *out) {
              switch (type) {
                  case 'b': out[0] = (unsigned char)v; return 1;
                  case 'w': { uint32_t x = (uint32_t)v; memcpy(out, &x, 4); return 4; }
                  case 'f': { float x = (float)v; memcpy(out, &x, 4); return 4; }
                  case 'd': { double x = v; memcpy(out, &x, 8); return 8; }
                  default: return 0;
              }
          }

          static int val_read(unsigned long a, char type, double *out) {
              unsigned char b[8];
              int n = type_bytes(type, 0, b);
              if (n <= 0 || rd(a, b, (size_t)n)) return -1;
              switch (type) {
                  case 'b': *out = b[0]; break;
                  case 'w': { uint32_t x; memcpy(&x, b, 4); *out = (double)x; break; }
                  case 'f': { float x; memcpy(&x, b, 4); *out = (double)x; break; }
                  case 'd': { double x; memcpy(&x, b, 8); *out = x; break; }
              }
              return 0;
          }

          static int val_write(unsigned long a, char type, double v) {
              unsigned char b[8];
              int n = type_bytes(type, v, b);
              return n <= 0 ? -1 : wr(a, b, (size_t)n);
          }

          static int val_eq(double a, double b, char type) {
              if (type == 'f') return fabsf((float)a - (float)b) <= 0.0005f;
              if (type == 'd') return fabs(a - b) <= 1e-9;
              return (uint64_t)a == (uint64_t)b;
          }

          static int fset_save(const uint64_t *a, uint32_t n, char type, const char *path) {
              FILE *f = fopen(path, "wb");
              if (!f) return -1;
              fwrite(&n, 4, 1, f);
              fwrite(&type, 1, 1, f);
              if (n) fwrite(a, 8, n, f);
              fclose(f);
              return 0;
          }

          static int fset_load(uint64_t *a, uint32_t *n, char *type, const char *path) {
              FILE *f = fopen(path, "rb");
              if (!f) return -1;
              if (fread(n, 4, 1, f) != 1) { fclose(f); return -1; }
              if (fread(type, 1, 1, f) != 1) { fclose(f); return -1; }
              if (*n > FSET_CAP) *n = FSET_CAP;
              size_t got = fread(a, 8, *n, f);
              *n = (uint32_t)got;
              fclose(f);
              return 0;
          }

          static int snap_save(const uint64_t *a, uint32_t n, char type) {
              FILE *f = fopen(FSNAP, "wb");
              if (!f) return -1;
              fwrite(&n, 4, 1, f);
              fwrite(&type, 1, 1, f);
              for (uint32_t i = 0; i < n; i++) {
                  double v = 0;
                  val_read(a[i], type, &v);
                  fwrite(&a[i], 8, 1, f);
                  fwrite(&v, 8, 1, f);
              }
              fclose(f);
              return 0;
          }

          static int snap_load(uint64_t *a, double *v, uint32_t *n, char *type) {
              FILE *f = fopen(FSNAP, "rb");
              if (!f) return -1;
              if (fread(n, 4, 1, f) != 1) { fclose(f); return -1; }
              if (fread(type, 1, 1, f) != 1) { fclose(f); return -1; }
              if (*n > FSET_CAP) *n = FSET_CAP;
              uint32_t got = 0;
              for (uint32_t i = 0; i < *n; i++) {
                  if (fread(&a[i], 8, 1, f) != 1) break;
                  if (fread(&v[i], 8, 1, f) != 1) break;
                  got++;
              }
              *n = got;
              fclose(f);
              return 0;
          }

          static int cmd_probe(pid_t pid) {
              char p[64];
              snprintf(p, sizeof p, "/proc/%d/status", pid);
              FILE *f = fopen(p, "r");
              if (!f) { printf("! /proc/%d/status unreadable: %s\n", pid, strerror(errno)); return 1; }
              char line[256];
              while (fgets(line, sizeof line, f)) {
                  if (!strncmp(line, "Name:", 5) || !strncmp(line, "TracerPid:", 10) ||
                      !strncmp(line, "State:", 6))
                      printf("%s", line);
              }
              fclose(f);

              struct reg *v = NULL;
              int n = parse_maps(pid, &v);
              printf("maps=%d\n", n);
              unsigned long probe = 0;
              if (n > 0) probe = v[0].lo;
              if (v) free(v);

              if (mem_open(pid)) { printf("RESULT: FAIL\n"); return 1; }
              if (g_ptrace_note) printf("note: opened via ptrace attach/detach (safe, tracer released)\n");
              unsigned char t[16];
              int r = rd(probe, t, 16);
              printf("probe=%016lx %s\n", probe, r ? "FAIL" : "OK");
              printf("RESULT: %s\n", r ? "PARTIAL" : "OK");
              return r ? 1 : 0;
          }

          static int cmd_aim(pid_t pid, unsigned long cam, unsigned long me, unsigned long arr,
                             int count, int stride, int posoff, float smooth, float fov,
                             char mode, int flags) {
              if (mem_open(pid)) return 1;
              printf("aim pid=%d cam=%lx me=%lx arr=%lx n=%d stride=%d posoff=%d smooth=%.2f fov=%.1f mode=%c flags=%d\n",
                     pid, cam, me, arr, count, stride, posoff, smooth, fov, mode, flags);
              int fail = 0, iter = 0;
              for (;;) {
                  iter++;
                  float yaw = 0, pitch = 0, mp[3];
                  if (rd(cam, &yaw, 4) || rd(cam + 4, &pitch, 4) || rd(me + posoff, mp, 12)) {
                      if (++fail % 120 == 0) printf("! read fail x%d (cam/me wrong?)\n", fail);
                      usleep(15000);
                      continue;
                  }
                  unsigned long best = 0;
                  float bestd = 1e30f;
                  for (int i = 0; i < count; i++) {
                      unsigned long e = arr + (unsigned long)i * (unsigned long)stride;
                      if (stride == 4 || stride == 8) {
                          unsigned long ep = 0;
                          if (rd(e, &ep, (size_t)stride)) continue;
                          if (!ep) continue;
                          e = ep;
                      }
                      float p[3];
                      if (rd(e + posoff, p, 12)) continue;
                      float dx = p[0] - mp[0], dz = p[2] - mp[2];
                      float h = sqrtf(dx * dx + dz * dz);
                      if (h < 1.0f) continue;
                      if (fov > 0.0f && h > fov) continue;
                      if (h < bestd) { bestd = h; best = e; }
                  }
                  if (best) {
                      float p[3];
                      if (!rd(best + posoff, p, 12)) {
                          float dx = p[0] - mp[0], dy = p[1] - mp[1], dz = p[2] - mp[2];
                          float h = sqrtf(dx * dx + dz * dz);
                          if (h > 0.01f) {
                              float ty = (flags & 4) ? atan2f(dz, dx) * RAD2DEG
                                                     : atan2f(dx, dz) * RAD2DEG;
                              float tp = -atan2f(dy, h) * RAD2DEG;
                              if (flags & 1) ty = -ty;
                              if (flags & 2) tp = -tp;
                              float d = ty - yaw;
                              while (d > 180.0f) d -= 360.0f;
                              while (d < -180.0f) d += 360.0f;
                              yaw += d * smooth;
                              pitch += (tp - pitch) * smooth;
                              if (mode == 'q') {
                                  float hy = yaw * 0.5f * DEG2RAD, hp = pitch * 0.5f * DEG2RAD;
                                  float cy = cosf(hy), sy = sinf(hy);
                                  float cx = cosf(hp), sx = sinf(hp);
                                  float q[4] = { cy * sx, sy * cx, -sy * sx, cy * cx };
                                  wr(cam, q, 16);
                              } else {
                                  wr(cam, &yaw, 4);
                                  wr(cam + 4, &pitch, 4);
                              }
                          }
                      }
                  }
                  if (iter % 125 == 0)
                      printf("yaw=%.2f pitch=%.2f target=%s dist=%.1f\n",
                             yaw, pitch, best ? "yes" : "no", bestd < 1e29f ? bestd : -1.0f);
                  usleep(8000);
              }
          }

          static void usage(void) {
              printf(
                  "vnxmem - non-root process memory tool\n"
                  "  probe     <pid>\n"
                  "  tracerpid <pid>\n"
                  "  mods      <pid>\n"
                  "  regions   <pid>\n"
                  "  read      <pid> <hexaddr> <len>\n"
                  "  write     <pid> <hexaddr> <hexbytes>\n"
                  "  find      <pid> <lo> <hi> <b|w|f|d|h> <pattern>\n"
                  "  findm     <pid> <module> <b|w|f|d|h> <pattern>\n"
                  "  fnew      <pid> <module> <b|w|f|d> <value>\n"
                  "  fnext     <pid> <b|w|f|d> <value>\n"
                  "  frange    <pid> <b|w|f|d> <min> <max>\n"
                  "  fshow     <pid> [limit]\n"
                  "  fset      <pid> <index> <b|w|f|d> <value>\n"
                  "  fsnap     <pid>\n"
                  "  frestore  <pid>\n"
                  "  freset\n"
                  "  aim       <pid> <cam> <me> <arr> <count> <stride> <posoff> <smooth> <fov> [e|q] [flags]\n");
          }

          int main(int argc, char **argv) {
              setvbuf(stdout, NULL, _IONBF, 0);
              if (argc < 2) { usage(); return 1; }
              const char *cmd = argv[1];

              if (!strcmp(cmd, "help") || !strcmp(cmd, "-h") || !strcmp(cmd, "version")) {
                  usage(); return 0;
              }
              if (!strcmp(cmd, "freset")) { unlink(FSET); unlink(FSNAP); printf("cleared\n"); return 0; }
              if (argc < 3) { usage(); return 1; }

              pid_t pid = (pid_t)atoi(argv[2]);
              if (pid <= 0) { printf("! bad pid\n"); return 1; }

              if (!strcmp(cmd, "tracerpid")) { printf("tracerpid %d\n", tracerpid(pid)); return 0; }
              if (!strcmp(cmd, "probe")) return cmd_probe(pid);

              if (!strcmp(cmd, "regions") || !strcmp(cmd, "mods")) {
                  struct reg *v = NULL;
                  int n = parse_maps(pid, &v);
                  if (n < 0) { printf("! cannot read /proc/%d/maps\n", pid); return 1; }
                  for (int i = 0; i < n; i++) {
                      if (!strcmp(cmd, "mods")) {
                          if (v[i].path[0] == '/' && strchr(v[i].perm, 'x'))
                              printf("%016lx %9lu %s\n", v[i].lo,
                                     (unsigned long)(v[i].hi - v[i].lo), base_name(v[i].path));
                      } else {
                          printf("%016lx-%016lx %s %s\n", v[i].lo, v[i].hi, v[i].perm, v[i].path);
                      }
                  }
                  free(v);
                  return 0;
              }

              if (mem_open(pid)) return 1;

              if (!strcmp(cmd, "read") && argc >= 5) {
                  unsigned long a = strtoul(argv[3], NULL, 16);
                  size_t n = (size_t)strtoul(argv[4], NULL, 10);
                  if (n == 0 || n > (8u << 20)) { printf("! bad len (1..8388608)\n"); return 1; }
                  unsigned char *b = malloc(n);
                  if (!b) return 1;
                  if (rd_stable(a, b, n)) { free(b); printf("! read failed at %016lx\n", a); return 1; }
                  for (size_t i = 0; i < n; i++) printf("%02x", b[i]);
                  printf("\n");
                  free(b);
                  return 0;
              }

              if (!strcmp(cmd, "write") && argc >= 5) {
                  unsigned long a = strtoul(argv[3], NULL, 16);
                  size_t cap = strlen(argv[4]) / 2 + 2;
                  unsigned char *b = malloc(cap);
                  unsigned char *chk = malloc(cap);
                  if (!b || !chk) { free(b); free(chk); return 1; }
                  int got = hexb(argv[4], b, cap);
                  if (got <= 0) { free(b); free(chk); printf("! empty hex\n"); return 1; }
                  int r = wr(a, b, (size_t)got);
                  int v = rd(a, chk, (size_t)got);
                  int same = !r && !v && !memcmp(b, chk, (size_t)got);
                  free(b); free(chk);
                  if (r) { printf("! write failed\n"); return 1; }
                  printf(same ? "ok %d bytes @ %016lx (verified)\n"
                              : "warn %d bytes @ %016lx (readback differs)\n", got, a);
                  return 0;
              }

              if (!strcmp(cmd, "find") && argc >= 7) {
                  unsigned char pat[64], msk[64]; int esz = 0;
                  int n = compile_pat(argv[5][0], argv[6], pat, msk, &esz);
                  if (n <= 0) { printf("! bad pattern\n"); return 1; }
                  unsigned long lo = strtoul(argv[3], NULL, 16), hi = strtoul(argv[4], NULL, 16);
                  if (lo >= hi) { printf("! bad range\n"); return 1; }
                  uint64_t *hits = malloc((size_t)MAXHITS * sizeof *hits);
                  if (!hits) return 1;
                  int t = scan_region(lo, hi, pat, msk, n, hits, MAXHITS);
                  for (int i = 0; i < t; i++) printf("%016llx\n", (unsigned long long)hits[i]);
                  printf("hits %d%s\n", t, t >= MAXHITS ? " (truncated)" : "");
                  free(hits);
                  return t ? 0 : 2;
              }

              if (!strcmp(cmd, "findm") && argc >= 6) {
                  unsigned char pat[64], msk[64]; int esz = 0;
                  int n = compile_pat(argv[4][0], argv[5], pat, msk, &esz);
                  if (n <= 0) { printf("! bad pattern\n"); return 1; }
                  struct reg *v = NULL;
                  int rc = parse_maps(pid, &v);
                  if (rc < 0) { printf("! cannot read maps\n"); return 1; }
                  uint64_t *hits = malloc((size_t)MAXHITS * sizeof *hits);
                  if (!hits) { free(v); return 1; }
                  int t = 0;
                  for (int i = 0; i < rc && t < MAXHITS; i++) {
                      if (!strchr(v[i].perm, 'r')) continue;
                      if (v[i].path[0] != '/') continue;
                      if (strcmp(base_name(v[i].path), argv[3])) continue;
                      t += scan_region(v[i].lo, v[i].hi, pat, msk, n, hits + t, MAXHITS - t);
                  }
                  free(v);
                  for (int i = 0; i < t; i++) printf("%016llx\n", (unsigned long long)hits[i]);
                  printf("hits %d%s\n", t, t >= MAXHITS ? " (truncated)" : "");
                  free(hits);
                  return t ? 0 : 2;
              }

              if (!strcmp(cmd, "fnew") && argc >= 6) {
                  char type = argv[4][0];
                  double val = (type == 'f') ? (double)strtof(argv[5], NULL) : strtod(argv[5], NULL);
                  unsigned char pat[8], msk[8];
                  int n = type_bytes(type, val, pat);
                  if (n <= 0) { printf("! bad type\n"); return 1; }
                  memset(msk, 0xFF, 8);
                  struct reg *v = NULL;
                  int rc = parse_maps(pid, &v);
                  if (rc < 0) { printf("! cannot read maps\n"); return 1; }
                  uint64_t *hits = malloc((size_t)FSET_CAP * sizeof *hits);
                  if (!hits) { free(v); return 1; }
                  int t = 0;
                  for (int i = 0; i < rc && t < FSET_CAP; i++) {
                      if (!strchr(v[i].perm, 'r')) continue;
                      if (v[i].path[0] != '/') continue;
                      if (strcmp(base_name(v[i].path), argv[3])) continue;
                      t += scan_region(v[i].lo, v[i].hi, pat, msk, n, hits + t, FSET_CAP - t);
                  }
                  free(v);
                  int r = fset_save(hits, (uint32_t)t, type, FSET);
                  free(hits);
                  if (r) { printf("! cannot save set\n"); return 1; }
                  printf("set %d candidates (type %c)\n", t, type);
                  return t ? 0 : 2;
              }

              if ((!strcmp(cmd, "fnext") || !strcmp(cmd, "frange")) && argc >= 5) {
                  uint64_t *a = malloc((size_t)FSET_CAP * sizeof *a);
                  uint64_t *keep = malloc((size_t)FSET_CAP * sizeof *keep);
                  if (!a || !keep) { free(a); free(keep); return 1; }
                  uint32_t n = 0; char t0 = 0;
                  if (fset_load(a, &n, &t0, FSET)) { free(a); free(keep); printf("! no filter set\n"); return 1; }
                  char type = argv[3][0];
                  if (type != t0) { printf("! type mismatch: set holds '%c'\n", t0); free(a); free(keep); return 1; }
                  uint32_t k = 0;
                  if (!strcmp(cmd, "fnext")) {
                      double want = (type == 'f') ? (double)strtof(argv[4], NULL) : strtod(argv[4], NULL);
                      for (uint32_t i = 0; i < n; i++) {
                          double v;
                          if (val_read(a[i], type, &v)) continue;
                          if (val_eq(v, want, type)) keep[k++] = a[i];
                      }
                  } else {
                      if (argc < 6) { free(a); free(keep); printf("! need min max\n"); return 1; }
                      double lo = strtod(argv[4], NULL), hi = strtod(argv[5], NULL);
                      for (uint32_t i = 0; i < n; i++) {
                          double v;
                          if (val_read(a[i], type, &v)) continue;
                          if (v >= lo && v <= hi) keep[k++] = a[i];
                      }
                  }
                  free(a);
                  fset_save(keep, k, type, FSET);
                  free(keep);
                  printf("remaining %u\n", k);
                  return k ? 0 : 2;
              }

              if (!strcmp(cmd, "fshow")) {
                  uint64_t *a = malloc((size_t)FSET_CAP * sizeof *a);
                  if (!a) return 1;
                  uint32_t n = 0; char t = 0;
                  if (fset_load(a, &n, &t, FSET)) { free(a); printf("! no filter set\n"); return 1; }
                  int lim = argc >= 4 ? atoi(argv[3]) : 40;
                  if (lim <= 0 || lim > (int)n) lim = (int)n;
                  for (int i = 0; i < lim; i++) {
                      double v = 0;
                      if (val_read(a[i], t, &v)) {
                          printf("%6d %016llx ???\n", i, (unsigned long long)a[i]);
                          continue;
                      }
                      if (t == 'f' || t == 'd')
                          printf("%6d %016llx %.6f\n", i, (unsigned long long)a[i], v);
                      else
                          printf("%6d %016llx %llu\n", i, (unsigned long long)a[i],
                                 (unsigned long long)v);
                  }
                  printf("count %u type %c\n", n, t);
                  free(a);
                  return 0;
              }

              if (!strcmp(cmd, "fset") && argc >= 6) {
                  uint64_t *a = malloc((size_t)FSET_CAP * sizeof *a);
                  if (!a) return 1;
                  uint32_t n = 0; char t = 0;
                  if (fset_load(a, &n, &t, FSET)) { free(a); printf("! no filter set\n"); return 1; }
                  unsigned idx = (unsigned)atoi(argv[3]);
                  if (idx >= n) { free(a); printf("! index range 0..%u\n", n ? n - 1 : 0); return 1; }
                  char type = argv[4][0];
                  double val = (type == 'f') ? (double)strtof(argv[5], NULL) : strtod(argv[5], NULL);
                  int r = val_write(a[idx], type, val);
                  double chk = 0;
                  int ver = (!r && !val_read(a[idx], type, &chk) && val_eq(chk, val, type));
                  free(a);
                  if (r) { printf("! write failed\n"); return 1; }
                  printf(ver ? "wrote index %u (verified)\n"
                             : "warn index %u written (readback differs)\n", idx);
                  return 0;
              }

              if (!strcmp(cmd, "fsnap")) {
                  uint64_t *a = malloc((size_t)FSET_CAP * sizeof *a);
                  if (!a) return 1;
                  uint32_t n = 0; char t = 0;
                  if (fset_load(a, &n, &t, FSET)) { free(a); printf("! no filter set\n"); return 1; }
                  int r = snap_save(a, n, t);
                  free(a);
                  if (r) { printf("! snapshot failed\n"); return 1; }
                  printf("snapshot saved: %u values\n", n);
                  return 0;
              }

              if (!strcmp(cmd, "frestore")) {
                  uint64_t *a = malloc((size_t)FSET_CAP * sizeof *a);
                  double *v = malloc((size_t)FSET_CAP * sizeof *v);
                  if (!a || !v) { free(a); free(v); return 1; }
                  uint32_t n = 0; char t = 0;
                  if (snap_load(a, v, &n, &t)) { free(a); free(v); printf("! no snapshot\n"); return 1; }
                  int ok = 0, bad = 0;
                  for (uint32_t i = 0; i < n; i++) {
                      if (val_write(a[i], t, v[i])) bad++; else ok++;
                  }
                  free(a); free(v);
                  printf("restored %d, failed %d\n", ok, bad);
                  return bad ? 1 : 0;
              }

              if (!strcmp(cmd, "aim") && argc >= 11) {
                  char mode = argc >= 12 ? argv[11][0] : 'e';
                  int flags = argc >= 13 ? atoi(argv[12]) : 0;
                  return cmd_aim(pid,
                      strtoul(argv[3], NULL, 16), strtoul(argv[4], NULL, 16),
                      strtoul(argv[5], NULL, 16), atoi(argv[6]), atoi(argv[7]), atoi(argv[8]),
                      strtof(argv[9], NULL), strtof(argv[10], NULL), mode, flags);
              }

              usage();
              return 1;
          }
          EOF

