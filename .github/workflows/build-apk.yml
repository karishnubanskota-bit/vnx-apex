      - name: Verify C source compiles
        run: |
          gcc -O2 -Wall -o /tmp/vnxmem_host app/src/main/cpp/vnxmem.c -lm
          /tmp/vnxmem_host help | head -3
          echo "C source OK"

      - name: Build native helper
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/26.1.10909125"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          OUT=app/src/main/assets
          mkdir -p "$OUT"
          build() {
            local abi="$1" triple="$2"
            "$TC/${triple}24-clang" -O2 -static -fPIE -pie -ffunction-sections \
              -fdata-sections -Wl,--gc-sections -Wall \
              -o "$OUT/vnxmem-$abi" app/src/main/cpp/vnxmem.c -lm
            "$TC/llvm-strip" "$OUT/vnxmem-$abi"
            echo "built $abi -> $(stat -c%s "$OUT/vnxmem-$abi") bytes"
          }
          build arm64-v8a   aarch64-linux-android
          build armeabi-v7a armv7a-linux-androideabi
          build x86_64      x86_64-linux-android
          build x86         i686-linux-android
          for a in arm64-v8a armeabi-v7a x86_64 x86; do
            test -s "$OUT/vnxmem-$a" || { echo "missing $a"; exit 1; }
          done

      - name: Assemble debug
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/gradle.log

      - name: Assemble release
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee -a /tmp/gradle.log

      - name: Show build error
        if: failure()
        run: |
          echo "=========== GRADLE ERROR (last 100 lines) ==========="
          tail -n 100 /tmp/gradle.log 2>/dev/null || echo "(no log captured)"
          echo "=========== END ==========="

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnx-apex-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
